name: Release to Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  build_and_distribute:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - run: flutter pub get

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # pubspec.yaml pins a fixed build number; override it with the run
      # number so every release gets a strictly-increasing Android
      # versionCode, otherwise Android refuses to install it as an update.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUP }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "${{ github.ref_name }} @ ${{ github.sha }} — ${{ github.event.head_commit.message }}"

      # Publishes the same signed APK as a public GitHub Release asset under a
      # fixed "latest" tag, so https://github.com/<org>/<repo>/releases/latest/download/WakeelAI.apk
      # always resolves to the newest build. Unlike Firebase App Distribution
      # above (invite-only testers), this needs no Google account or tester
      # invite — anyone with the link can download and sideload it directly.
      - name: Rename APK for public download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/WakeelAI.apk

      # The `versionCode: N` line is machine-read by the app's in-app
      # update checker (lib/core/updates/update_checker_service.dart) — the
      # release itself is always tagged "latest", so this is the only place
      # a comparable version number lives.
      - name: Publish public download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/app/outputs/flutter-apk/WakeelAI.apk \
            --repo "${{ github.repository }}" \
            --title "Latest Build" \
            --notes "versionCode: ${{ github.run_number }}
          Automatically updated on every push to main. Commit: ${{ github.sha }} — ${{ github.event.head_commit.message }}" \
            --latest
